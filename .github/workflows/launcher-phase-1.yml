name: Liquid Hybrid Launcher Build

on:
  push:
    branches: [ ios-hios-launcher-phase-1 ]
    paths:
      - "projects/ios-hios-launcher/**"
      - ".github/workflows/launcher-phase-1.yml"
  pull_request:
    paths:
      - "projects/ios-hios-launcher/**"
      - ".github/workflows/launcher-phase-1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build launcher APK
        working-directory: projects/ios-hios-launcher
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Liquid-Hybrid-Launcher-debug
          path: projects/ios-hios-launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
